name: Release Jarvis Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jarvis-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Generate release version
        id: release_meta
        run: |
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Jarvis ${{ steps.release_meta.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          prerelease: false
          draft: false
          files: app/build/outputs/apk/release/*.apk
