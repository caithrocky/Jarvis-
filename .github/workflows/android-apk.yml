name: Build Jarvis Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Jarvis APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Jarvis source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set build version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Verify Android project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build Jarvis debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Jarvis debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare permanent release signing key
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Verify permanent release signing credentials
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null
          keytool -certreq -alias upload -keystore my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/jarvis-signing-check.csr" >/dev/null
          echo "Release keystore and private-key credentials verified."

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Stage release APK
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/Jarvis.apk
          test -s release-assets/Jarvis.apk
          ls -lh release-assets/Jarvis.apk

      - name: Publish GitHub Release
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASSWORD != '' && env.KEY_PASSWORD != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: JARVIS ${{ env.VERSION_NAME }}
          body: |
            Automatic JARVIS Android release.

            versionName: ${{ env.VERSION_NAME }}
            versionCode: ${{ env.VERSION_CODE }}

            Download Jarvis.apk and install it over your existing app.
          files: release-assets/Jarvis.apk
          make_latest: true

      - name: Explain why signed release was skipped
        if: env.KEYSTORE_BASE64 == '' || env.STORE_PASSWORD == '' || env.KEY_PASSWORD == ''
        run: |
          echo "::notice::Debug APK built. Signed release build skipped: confirm KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD are all configured."
