
name: Build Jarvis Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Jarvis source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36.1
        run: |
          sdkmanager --install \
            "platforms;android-36-ext1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create debug signing key if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Jarvis debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
